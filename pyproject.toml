[tool.poetry]
name = "loan-user-agentic-python-service"
version = "0.1.0"
description = "Loan User Agentic Python Service with LangChain and FastAPI"
authors = ["Your Name <your.email@example.com>"]
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.1"
uvicorn = "^0.24.0"
langchain = "0.0.350"
langchain-community = "0.0.10"
langchain-openai = "0.0.2"
pydantic = "^2.5.2"
python-dotenv = "^1.0.0"
httpx = "^0.25.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api" 